    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu');

        :root {
            --bg: #0a0a0a;
            --card: #111113;
            --border: #222226;
            --accent: #3b82f6;
            --text: #e4e4e7;
            --muted: #a1a1aa;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Ubuntu', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1480px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Header */
        header {
            border-bottom: 1px solid var(--border);
            background: rgba(10, 10, 10, 0.97);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        h1 {
            font-family: 'Ubuntu', Arial, system-ui, sans-serif;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        /* VIP Links */
        .vip-links {
            display: flex;
            gap: 10px;
        }

        .vip-link {
            width: 42px;
            height: 42px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .vip-link:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        /* Search */
        .search-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 50px 0 60px 0;
        }

        .search-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 9999px;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            width: 460px;
            transition: all 0.3s ease;
        }

        .search-box:hover,
        .search-box:focus-within {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .search-box input {
            font-family: 'Ubuntu';
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16.5px;
            width: 100%;
            margin-left: 12px;
        }

        /* Categories */
        .category {
            margin-bottom: 55px;
        }

        .category-title {
            font-size: 17px;
            color: var(--muted);
            margin-bottom: 18px;
            padding-left: 6px;
            font-weight: 500;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
            gap: 16px;
        }

        .link-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 16px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.35s ease;
        }

        .link-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .link-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .link-text {
            font-size: 14.2px;
            font-weight: 500;
        }

        footer {
            text-align: center;
            color: #52525b;
            font-size: 13px;
            margin-top: 40px;
        }
    </style>
</head>
