<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            overflow: hidden;
        }

        /* Wrapper voor animaties */
        .loader-wrapper {
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
            transition: all 0.8s ease;
        }

        /* Fade-out + zoom effect */
        .fade-out {
            opacity: 0;
            transform: scale(1.2);
            filter: blur(8px);
        }

        .spinner {
            position: relative;
            width: 56px;
            height: 56px;
            animation: spinner-x0t3la 3s infinite linear;
        }

        .spinner::before {
            content: '';
            display: block;
            height: 56px;
            width: 11.2px;
            animation: spinner-x0t3la 0.5s infinite;
            background: #00a9bc;
            position: absolute;
            left: 50%;
            margin-left: -5.6px;
            box-shadow: 0 0 15px #00a9bc;
        }

        @keyframes spinner-x0t3la {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script>
        window.onload = function() {
            const loader = document.querySelector(".loader-wrapper");

            // Na 2 seconden start fade-out
            setTimeout(() => {
                loader.classList.add("fade-out");

                // Na animatie redirect
                setTimeout(() => {
                    window.location.href = "lie";
                }, 800); // gelijk aan transition snelheid
            }, 2000);
        };
    </script>
</head>

<body>
    <div class="loader-wrapper">
        <div class="spinner"></div>
    </div>
</body>
</html>
