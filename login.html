<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Login</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#0f172a,#111827,#1e293b);
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#2563eb33,transparent);
top:-200px;
right:-200px;
}

body::after{
content:"";
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,#3b82f633,transparent);
bottom:-200px;
left:-200px;
}

.login-card{
position:relative;
z-index:10;
width:420px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(30px);
border:1px solid rgba(255,255,255,0.1);
border-radius:24px;
padding:40px;
box-shadow:
0 25px 50px rgba(0,0,0,.4);
}

.logo{
font-size:32px;
margin-bottom:10px;
}

h1{
color:white;
font-size:28px;
font-weight:600;
margin-bottom:8px;
}

.subtitle{
color:#94a3b8;
margin-bottom:30px;
}

.input-group{
margin-bottom:18px;
}

input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,0.08);
color:white;
font-size:15px;
}

input::placeholder{
color:#94a3b8;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

#error{
margin-top:15px;
color:#ef4444;
text-align:center;
display:none;
}
</style>
</head>
<body>

<div class="login-card">

<div class="logo">🔷</div>

<h1>Aanmelden</h1>
<p class="subtitle">Enterprise Identity Platform</p>

<div class="input-group">
<input id="username" placeholder="Gebruikersnaam">
</div>

<div class="input-group">
<input id="password" type="password" placeholder="Wachtwoord">
</div>

<button onclick="login()">
Aanmelden
</button>

<div id="error">
Ongeldige gebruikersnaam of wachtwoord
</div>

</div>

<script>

const USERNAME = "admin";

/*
SHA-256 hash van:
Welkom123!
*/

const PASSWORD_HASH =
"7620f6cbf5d853f7c9f6f14e30c3e4e8f3f6c90b42f8f0dc1d846b96d5eab2b8";

if(localStorage.getItem("sessionExpiry")){

const expiry =
parseInt(localStorage.getItem("sessionExpiry"));

if(Date.now() < expiry){
window.location.href="start.html";
}

}

async function sha256(text){

const data = new TextEncoder().encode(text);

const hashBuffer =
await crypto.subtle.digest("SHA-256",data);

const hashArray =
Array.from(new Uint8Array(hashBuffer));

return hashArray
.map(b=>b.toString(16).padStart(2,"0"))
.join("");

}

async function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const hash = await sha256(password);

if(
username === USERNAME &&
hash === PASSWORD_HASH
){

const expiry =
Date.now() + (15 * 60 * 1000);

localStorage.setItem(
"sessionExpiry",
expiry
);

window.location.href="start.html";

}else{

document.getElementById("error").style.display="block";

}

}
</script>

</body>
</html>
