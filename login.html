.container{
    width:440px;
    background:white;
    padding:48px;
    box-shadow:0 8px 40px rgba(0,0,0,.08);
}

.logo{
    width:28px;
    height:28px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px;
    margin-bottom:24px;
}

.logo div:nth-child(1){background:#f25022;}
.logo div:nth-child(2){background:#7fba00;}
.logo div:nth-child(3){background:#00a4ef;}
.logo div:nth-child(4){background:#ffb900;}

h1{
    font-size:26px;
    font-weight:600;
    color:#1b1b1b;
    margin-bottom:20px;
}

input{
    width:100%;
    border:none;
    border-bottom:1px solid #8a8886;
    padding:10px 0;
    font-size:15px;
    outline:none;
    margin-bottom:22px;
}

input:focus{
    border-bottom:2px solid #0067b8;
}

button{
    float:right;
    border:none;
    background:#0067b8;
    color:white;
    padding:10px 36px;
    font-size:14px;
    cursor:pointer;
}

button:hover{
    background:#005da6;
}

#error{
    color:#d13438;
    margin-top:15px;
    display:none;
}

.loading{
    display:none;
    color:#0067b8;
    margin-top:15px;
}

<body>

<div class="container">

    <div class="logo">
        <div></div><div></div>
        <div></div><div></div>
    </div>

    <h1>Aanmelden</h1>

    <input id="username" placeholder="E-mailadres, telefoon of Skype">

    <input id="password"
           type="password"
           placeholder="Wachtwoord">

    <button onclick="login()">Aanmelden</button>

    <div style="clear:both"></div>

    <div id="loading" class="loading">
        Aanmelden...
    </div>

    <div id="error">
        Ongeldige gebruikersnaam of wachtwoord.
    </div>

</div>

<script>

const USERNAME = "enterprise";

const PASSWORD_HASH =
"f46d78420f32ebdae515a0734f8b1741bd03875bdf8e19a43e74ab4db63a87ce";

const SESSION_MINUTES = 15;

// Controle bij openen
const expiry = localStorage.getItem("enterprise_session");

if(expiry && Date.now() < Number(expiry)){
    location.href = "start.html";
}

async function sha256(text){

    const data = new TextEncoder().encode(text);

    const hashBuffer =
        await crypto.subtle.digest("SHA-256", data);

    return Array.from(
        new Uint8Array(hashBuffer)
    )
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

}

async function login(){

    document.getElementById("error").style.display="none";
    document.getElementById("loading").style.display="block";

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const hash = await sha256(password);

    if(
        username === USERNAME &&
        hash === PASSWORD_HASH
    ){

        const expires =
            Date.now() + (SESSION_MINUTES * 60 * 1000);

        localStorage.setItem(
            "enterprise_session",
            expires
        );

        location.href = "start.html";

    }else{

        document.getElementById("loading").style.display="none";
        document.getElementById("error").style.display="block";

    }

}

document.addEventListener("keydown", e => {

    if(e.key === "Enter"){
        login();
    }

});

</script>

</body>
</html>
